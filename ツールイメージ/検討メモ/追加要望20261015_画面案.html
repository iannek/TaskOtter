-bottom:1px solid #e5e8ec;display:flex;align-items:center;justify-content:space-between}.mock-drawer h2{font-size:21px;margin:0}.mock-drawer form{padding:24px 28px;overflow:auto;flex:1}.mock-drawer footer{padding:20px 28px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid #e5e8ec}.control{display:block;width:100%;border:1px solid #d9dee6;border-radius:8px;padding:10px 12px;background:white;color:#20293a}.form-item{margin-bottom:22px}.form-item>label{display:block;font-weight:650;margin-bottom:9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.hint{color:#728095;font-size:13px;line-height:1.8}.quick-option{background:#fff8e9;padding:14px;border-radius:9px;margin-bottom:24px}.quick-option label{display:flex;gap:9px;align-items:center}.mock-drawer textarea{resize:vertical;min-height:42px;line-height:20px}.confirm{border:0;border-radius:14px;padding:28px;max-width:460px;width:calc(100% - 32px);color:#20293a;box-shadow:0 20px 80px #18233344}.confirm::backdrop{background:#18233377}.confirm h2{margin-top:0;font-size:21px}.confirm-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#182333;color:white;padding:14px 22px;border-radius:9px;z-index:60}.empty{padding:30px;color:#728095}@media(max-width:800px){.sidebar{display:none}.content{padding:22px 16px}.topbar{padding:0 16px}.mock-head,.mock-row{grid-template-columns:minmax(230px,1fr) 110px 110px 120px}.filter-line strong{width:100%}.top-note{display:none}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">◉ TaskOtter</div><button class="nav-btn">◫ ダッシュボード</button><button class="nav-btn active">☷ Task・Outcome</button><button class="nav-btn">▥ ガントチャート</button><button class="nav-btn">▦ カレンダー</button><div class="sidebar-bottom"><strong>Local JSON</strong><small>画面案 / サンプルデータ</small></div></aside><main class="main"><header class="topbar"><strong>Task・Outcome</strong><span style="flex:1"></span><span class="top-note">2026/10/15 の追加要望</span></header><div class="content"><div class="mock-note">操作できる画面案です。変更はこの画面内だけに反映され、再読み込みで元に戻ります。</div><div class="page-head"><h1 class="page-title">Task・Outcome</h1><button class="primary" id="new-task">＋ Task</button></div><section class="panel quick"><input class="control" id="quick-name" type="text" placeholder="思いついたTaskを名前だけでInboxへ追加" aria-label="Inboxへ追加するTask名"><label><input id="quick-check" type="checkbox"> 数分タスク</label><button class="primary" id="quick-add">追加</button></section><section class="panel mock-filters"><div class="filter-line"><strong>ステータス</strong><select class="field" id="status-mode" aria-label="ステータスの検索条件"><option value="include">選択を含む（OR）</option><option value="exclude">選択を除く（NOT）</option></select><div class="pills" id="status-options"></div></div><div class="filter-line"><strong>カテゴリ</strong><select class="field" id="category-mode" aria-label="カテゴリの検索条件"><option value="include">選択を含む（OR）</option><option value="exclude">選択を除く（NOT）</option></select><div class="pills" id="category-options"></div></div><div class="filter-line"><span class="hint" id="filter-summary"></span><button class="ghost" id="reset">条件をリセット</button></div></section><div class="view-tabs"><button class="view-tab active">階層一覧</button></div><div class="group-tabs" aria-label="階層表示の基準"><button class="secondary" id="by-outcome" aria-pressed="true">Outcome基準</button><button class="secondary" id="by-category" aria-pressed="false">カテゴリ基準</button></div><section class="panel mock-list" id="list"></section><p class="hint">Taskの行をクリックすると詳細を編集できます。</p></div></main></div><div class="veil" id="veil" hidden></div><aside class="mock-drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden><header><h2 id="drawer-title">Taskの詳細を編集</h2><button class="icon-button" id="close" aria-label="閉じる">×</button></header><form id="edit-form"><div class="form-item"><label for="name">Task名</label><textarea class="control" id="name" rows="1" required></textarea></div><div class="quick-option"><label><input type="checkbox" id="is-quick"> 数分タスク</label><div class="hint">メール確認など、名前だけで管理する小さなTask</div></div><div id="quick-hint" class="hint" hidden>名前だけでInboxに追加します。細かい項目の入力は不要です。</div><div id="details"><div class="two"><div class="form-item"><label for="status">ステータス</label><select class="control" id="status"></select></div><div class="form-item"><label for="category">カテゴリ</label><select class="control" id="category"></select></div></div><div class="form-item"><label for="outcome">Outcome</label><select class="control" id="outcome"></select></div><div class="two"><div class="form-item"><label for="start">対応予定日</label><input class="control" id="start" type="date"></div><div class="form-item"><label for="due">締切日</label><input class="control" id="due" type="date"></div></div><div class="form-item"><label for="memo">メモ</label><textarea class="control" id="memo" rows="4"></textarea></div></div><p class="hint" id="error" role="alert"></p></form><footer><button class="secondary" id="cancel">キャンセル</button><button class="primary" type="submit" form="edit-form">保存</button></footer></aside><dialog class="confirm" id="confirm"><h2>変更を保存しますか？</h2><p class="hint">保存していない変更があります。</p><div class="confirm-actions"><button class="secondary" id="keep">編集を続ける</button><button class="secondary" id="discard">変更を破棄</button><button class="primary" id="save-close">保存して閉じる</button></div></dialog><div class="toast" id="toast" role="status" hidden></div><script>
const $=s=>document.querySelector(s), statuses=['Inbox','NextAction','Doing','Waiting','Someday','Done'],categories=['業務改善','定例業務','レビュー'],outcomes=['業務改善の提案をまとめる','月次報告を提出する'];
let tasks=[{id:1,name:'ヒアリング結果を整理する',status:'Doing',category:'業務改善',outcome:outcomes[0]},{id:2,name:'改善案を作成する',status:'NextAction',category:'業務改善',outcome:outcomes[0]},{id:3,name:'提案資料をレビューする',status:'Waiting',category:'レビュー',outcome:outcomes[0]},{id:4,name:'集計データを確認する',status:'Inbox',category:'定例業務',outcome:outcomes[1]},{id:5,name:'メール確認',status:'Inbox',category:'',outcome:'',quick:true},{id:6,name:'前月データを取り込む',status:'Done',category:'定例業務',outcome:outcomes[1]}],group='outcome',editing=null,initial='',opener=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function options(values){return values.map(x=>`<option>${esc(x)}</option>`).join('')}
$('#status-options').innerHTML=statuses.map(x=>`<label><input type="checkbox" value="${x}" ${x==='Done'?'checked':''}>${x}</label>`).join('');$('#status-mode').value='exclude';$('#category-options').innerHTML=categories.map(x=>`<label><input type="checkbox" value="${x}">${x}</label>`).join('');$('#status').innerHTML=options(statuses);$('#category').innerHTML=options(['',...categories]);$('#outcome').innerHTML=options(['',...outcomes]);

function render(){const visible=tasks.filter(t=>['status','category'].every(k=>{const values=selected(k);return !values.length||($('#'+k+'-mode').value==='exclude'?!values.includes(t[k]):values.includes(t[k]))}));$('#filter-summary').textContent=['status','category'].map(k=>{const v=selected(k);return (k==='status'?'ステータス':'カテゴリ')+'：'+(v.length?v.join('・')+($('#'+k+'-mode').value==='exclude'?' を除く':' を含む'):'すべて')}).join(' ／ ')+' · '+visible.length+'件';const groups=group==='outcome'?[...outcomes,'']:[...categories,''];$('#by-outcome').setAttribute('aria-pressed',group==='outcome');$('#by-category').setAttribute('aria-pressed',group==='category');$('#list').innerHTML='<div class="mock-head"><span>Task</span><span>ステータス</span><span>カテゴリ</span><span>締切日</span></div>'+groups.map(g=>{const rows=visible.filter(t=>(t[group]||'')===g);if(!rows.length&&g)return '';return `<div class="mock-group ${group==='category'?'category':''}">⌄ ${esc(g||(group==='outcome'?'Outcomeなし':'カテゴリなし'))}</div>`+rows.map(t=>`<div class="mock-row" role="button" tabindex="0" data-id="${t.id}"><div>${t.status==='Done'?'☑':'☐'} ${esc(t.name)}${t.quick?'<span class="quick-tag">数分タスク</span>':''}${!t.quick?'<small>'+esc(group==='category'?(t.outcome||'Outcomeなし'):'資料 0 · チャット 0 · サブタスク 0/0')+'</small>':''}</div><span><span class="badge ${t.status}">${t.status}</span></span><span>${esc(t.category||'−')}</span><span>${esc(t.due||'−')}</span></div>`).join('')+`<button class="add-row" data-group="${esc(g)}">＋ Task</button>`}).join('')+(!visible.length?'<div class="empty">条件に一致するTaskはありません。</div>':'')}
function draft(){return {name:$('#name').value,quick:$('#is-quick').checked,status:$('#status').value,category:$('#category').value,outcome:$('#outcome').value,start:$('#start').value,due:$('#due').value,memo:$('#memo').value}}
function quickMode(){const q=$('#is-quick').checked;$('#details').hidden=q;$('#quick-hint').hidden=!q;$('#quick-hint').textContent=editing?.id?'名前だけで管理します。既存の詳細情報は保持する案です。':'名前だけでInboxに追加します。細かい項目の入力は不要です。'}
function open(t={}){opener=document.activeElement;editing=t;$('#drawer-title').textContent=t.id?'Taskの詳細を編集':'Taskを追加';for(const k of ['name','status','category','outcome','start','due','memo'])$('#'+k).value=t[k]||(k==='status'?'Inbox':'');$('#is-quick').checked=!!t.quick;quickMode();$('#error').textContent='';initial=JSON.stringify(draft());$('#veil').hidden=false;$('#drawer').hidden=false;$('#name').focus()}
function close(){if($('#confirm').open)$('#confirm').close();$('#drawer').hidden=true;$('#veil').hidden=true;opener?.focus()}
function requestClose(){if(JSON.stringify(draft())!==initial){$('#confirm').showModal();$('#keep').focus()}else close()}
function save(){const d=draft();if(!d.name.trim()){$('#error').textContent='Task名を入力してください。';if($('#confirm').open)$('#confirm').close();$('#name').focus();return}d.name=d.name.trim();if(d.quick&&!editing.id)Object.assign(d,{status:'Inbox',category:'',outcome:'',start:'',due:'',memo:''});const t={...editing,...d,id:editing.id||Date.now()};if(editing.id)tasks=tasks.map(x=>x.id===t.id?t:x);else tasks.push(t);close();render();notice('画面案内で保存しました')}
let timer;function notice(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,2500)}
$('.mock-filters').onchange=render;$('#reset').onclick=()=>{document.querySelectorAll('.pills input').forEach(x=>x.checked=false);$('#status-mode').value='include';$('#category-mode').value='include';render()};$('#by-outcome').onclick=()=>{group='outcome';render()};$('#by-category').onclick=()=>{group='category';render()};$('#new-task').onclick=()=>open();$('#list').onclick=e=>{const row=e.target.closest('[data-id]'),add=e.target.closest('[data-group]');if(row)open(tasks.find(t=>t.id===Number(row.dataset.id)));if(add)open({[group]:add.dataset.group})};$('#list').onkeydown=e=>{if(e.target.matches('[data-id]')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.click()}};$('#quick-add').onclick=()=>{const input=$('#quick-name');if(!input.value.trim()){input.focus();return}tasks.push({id:Date.now(),name:input.value.trim(),status:'Inbox',category:'',outcome:'',quick:$('#quick-check').checked});input.value='';render();notice('Inboxに追加しました')};$('#quick-name').onkeydown=e=>{if(e.key==='Enter')$('#quick-add').click()};$('#is-quick').onchange=quickMode;$('#edit-form').onsubmit=e=>{e.preventDefault();save()};$('#close').onclick=$('#cancel').onclick=$('#veil').onclick=requestClose;$('#keep').onclick=()=>$('#confirm').close();$('#discard').onclick=close;$('#save-close').onclick=save;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#drawer').hidden&&!$('#confirm').open){e.preventDefault();requestClose()}if(e.key==='Tab'&&!$('#drawer').hidden&&!$('#confirm').open){const els=[...$('#drawer').querySelectorAll('button,input,textarea,select')].filter(x=>x.getClientRects().length);const a=els[0],b=els.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}}});render();
</script></body></html>
