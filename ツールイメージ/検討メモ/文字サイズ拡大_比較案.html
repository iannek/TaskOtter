</style></head><body><div class="preview-banner"><strong>文字サイズ比較</strong><span>主な文字14px、日付13px、補助情報12px。フォント・配色は同じです。画面内の名前から詳細を開けます。</span><div class="type-switch" role="group" aria-label="文字サイズ"><button type="button" data-type="current" aria-pressed="false">従来サイズ</button><button type="button" data-type="large" aria-pressed="true">大きめサイズ</button></div></div>
<div class="app"><aside class="sidebar"><div class="brand-preview"><img src="../taskotter-logo-concept.png" alt="TaskOtter"></div><nav id="preview-nav"></nav><div class="sidebar-bottom"><strong>ローカルデータ</strong><small>検討用のサンプルデータ<br>再読み込みで初期状態へ戻ります</small><label class="time-step-label" for="preview-time-step">時刻の選択間隔</label><select id="preview-time-step" class="sidebar-time-step"><option value="15">15分</option><option value="30">30分</option></select><div class="local-controls"><span class="local-json">LOCAL · JSON</span><button class="sidebar-reload" onclick="location.reload()">再読み込み</button></div></div></aside><main class="main"><div class="content"><div class="page-head"><div><h1 class="page-title" id="view-title"></h1></div><div class="page-actions"><button class="secondary" id="add-outcome">＋ Outcome</button><button class="primary" id="add-task">＋ Task</button></div></div><div class="toolbar"><label class="selection-info"><input type="checkbox" id="show-done"> Doneも表示</label><span class="spacer"></span></div><div id="view-content"></div></div></main></div><div class="mobile-local-controls"><span class="local-json">LOCAL · JSON</span><button class="sidebar-reload" onclick="location.reload()">再読み込み</button></div>
<div class="preview-backdrop" hidden></div><aside class="preview-drawer" hidden aria-label="詳細の検討案"><div class="preview-drawer-head"><div class="eyebrow" id="drawer-kind"></div><div class="preview-heading-line"><h2 id="drawer-title">詳細を編集</h2><label class="outcome-complete-preview" id="outcome-complete-label"><input type="checkbox" id="outcome-complete">完了</label></div><button class="icon-button preview-close" aria-label="閉じる">×</button></div><div id="drawer-tabs" class="detail-tabs-preview"></div><div id="drawer-content" class="preview-drawer-body"></div><div class="preview-drawer-foot"><span class="selection-info">検討用サンプル</span><span class="spacer"></span><button class="secondary" id="drawer-cancel">キャンセル</button><button class="primary" id="drawer-save">保存</button></div></aside><div class="preview-toast" role="status" hidden></div>
<script>
const $=s=>document.querySelector(s);const nav=[['dashboard','◫','ダッシュボード'],['tasks','☷','Task・Outcome'],['gantt','▥','ガントチャート'],['calendar','▦','カレンダー']];
const collapsedOutcomes=new Set();
function groupKey(o){return o?.id||'__unassigned__'}
function expanded(o){return !collapsedOutcomes.has(groupKey(o))}
function foldHTML(o){const open=expanded(o),name=o?.name||'Outcomeなし';return `<button class="outcome-fold" data-fold="${esc(groupKey(o))}" aria-expanded="${open}" aria-label="${esc(name)}を${open?'折りたたむ':'展開する'}" title="${open?'折りたたむ':'展開する'}">${open?'▾':'▸'}</button>`}
let view='tasks',listView='list',period='fortnight',shift=0,showDone=false,timer;
const outcomes=[{id:'o1',name:'業務改善の提案をまとめる',start:'2026-09-28',end:'2026-10-09',complete:false},{id:'o2',name:'月次報告を提出する',start:'2026-10-01',end:'2026-10-16',complete:false},{id:'o3',name:'次期の運用計画を整理する',start:'2026-10-12',end:'2026-10-23',complete:false}];
const tasks=[{id:'t1',name:'ヒアリング結果を整理し、各部署で発生している重複入力と承認待ちの課題を分類して改善案に引き継ぎ、担当者別の対応手順と優先して見直す工程をまとめて次回の打ち合わせで確認する。海外拠点の運用についても追加ヒアリングを実施し、現行システムとの連携方法および移行時に必要な確認項目を整理して関係者へ共有する',outcome:'o1',status:'Doing',previous:'Doing',category:'業務改善',start:'2026-09-29',end:'2026-10-05'},{id:'t2',name:'改善案を作成する',outcome:'o1',status:'NextAction',previous:'NextAction',category:'業務改善',start:'2026-10-02',end:'2026-10-08'},{id:'t3',name:'提案資料をレビューする',outcome:'o1',status:'Waiting',previous:'Waiting',category:'レビュー',start:'2026-10-07',end:'2026-10-09'},{id:'t4',name:'前月データを取り込む',outcome:'o2',status:'Done',previous:'NextAction',category:'定例業務',start:'2026-10-01',end:'2026-10-02'},{id:'t5',name:'集計データを確認する',outcome:'o2',status:'Inbox',previous:'Inbox',category:'定例業務',start:'2026-10-05',end:'2026-10-10'}];
tasks.forEach((task, index) => { task.due=dayAdd(task.end,1); task.next=dayAdd('2026-10-02',index)+'T10:00'; task.nextEnd='11:00'; task.nextAction='ヒアリングメモを読み返し、課題を分類する。'; });
tasks[0].materials=[{url:'https://example.com/notes',summary:'ヒアリング資料'},{url:'https://example.com/report',summary:'報告資料'}];tasks[0].chats=[{url:'https://teams.microsoft.com/l/message/example',summary:'相談'}];tasks[0].subtasks=[{name:'整理する',complete:true},{name:'分類する',complete:false},{name:'確認する',complete:false}];
const statuses=['Inbox','NextAction','Waiting','Doing','Done','Someday'];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notice(text){$('.preview-toast').textContent=text;$('.preview-toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('.preview-toast').hidden=true,3200)}
function dayAdd(day,count){const d=new Date(day+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+count);return d.toISOString().slice(0,10)}
function displayDate(value, year=false){if(!value)return '-';if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return value;const d=new Date(value+'T12:00:00Z');if(Number.isNaN(d.getTime())||d.toISOString().slice(0,10)!==value)return value;return (year?d.getUTCFullYear()+'/':'')+(d.getUTCMonth()+1)+'/'+d.getUTCDate()+'('+['日','月','火','水','木','金','土'][d.getUTCDay()]+')'}
function inputDate(value){return value?displayDate(value,true):''}
function readDate(value){const match=value.trim().match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:\([日月火水木金土]\))?$/);return match?match[1]+'-'+match[2].padStart(2,'0')+'-'+match[3].padStart(2,'0'):value.trim()}
function visibleTasks(){return tasks.filter(t=>showDone||t.status!=='Done')}
function groups(){return [...outcomes.map(o=>({outcome:o,children:visibleTasks().filter(t=>t.outcome===o.id)})),{outcome:null,children:visibleTasks().filter(t=>!t.outcome)}]}
function completeTask(id,checked){const t=tasks.find(t=>t.id===id);if(checked){if(t.status!=='Done')t.previous=t.status;t.status='Done'}else t.status=t.previous||'Inbox';const parent=outcomes.find(o=>o.id===t.outcome);if(parent&&t.status!=='Done')parent.complete=false;render();notice(checked?'Doneに変更しました（サンプル）':'直前の未完了ステータスへ戻しました（サンプル）')}
function changeStatus(id,status){const t=tasks.find(t=>t.id===id);if(status==='Done'&&t.status!=='Done')t.previous=t.status;if(status!=='Done')t.previous=status;t.status=status;const parent=outcomes.find(o=>o.id===t.outcome);if(parent&&status!=='Done')parent.complete=false;render()}
function checkHTML(t){return `<input class="task-check" type="checkbox" aria-label="${esc(t.name)}の完了" data-check="${t.id}" ${t.status==='Done'?'checked':''}>`}
function countsHTML(t){const subtasks=t.subtasks||[];return `<div class="task-summary-preview" aria-label="関連項目の件数">資料 ${t.materials?.length||0} · チャット ${t.chats?.length||0} · サブタスク ${subtasks.filter(x=>x.complete).length}/${subtasks.length}</div>`}
function tableAuditDate(value){if(!value)return '不明';const d=new Date(value);return esc(displayDate(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')))+`<span class="history-time">${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</span>`}
function historyCells(item){return `<span class="history-cell history-created" title="${item?esc(item.createdAt?new Date(item.createdAt).toLocaleString('ja-JP'):'不明'):'対象なし'}">${item?tableAuditDate(item.createdAt):'—'}</span><span class="history-cell history-updated" title="${item?esc(item.updatedAt?new Date(item.updatedAt).toLocaleString('ja-JP'):'不明'):'対象なし'}">${item?tableAuditDate(item.updatedAt):'—'}</span>`}
function taskHTML(t){return `<div class="preview-task"><span class="task-indent-spacer" aria-hidden="true"></span>${checkHTML(t)}<div class="task-name-cell"><button title="${esc(t.name)}" class="task-name-preview ${t.status==='Done'?'done-name':''}" data-task="${t.id}">${esc(t.name)}</button>${countsHTML(t)}</div><select class="preview-status" aria-label="${esc(t.name)}のステータス" data-status="${t.id}">${statuses.map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select><span class="preview-category">${esc(t.category)}</span><span class="preview-range" title="${esc(inputDate(t.start))} ～ ${esc(inputDate(t.end))}">${esc(displayDate(t.start))} ～ ${esc(displayDate(t.end))}</span><span class="preview-due" title="${esc(inputDate(t.due))}">${esc(displayDate(t.due))}</span><span class="preview-next">${t.next?esc(displayDate(t.next.slice(0,10)))+'<br><span>'+esc(t.next.slice(11))+'–'+esc(t.nextEnd)+'</span>':'-'}</span></div>`}
function parentHTML(o){return `<div class="parent-row"><div class="parent-heading">${foldHTML(o)}${o?`<button title="${esc(o.name)}" class="parent-name" data-outcome="${o.id}">${esc(o.name)}</button>`:'<span class="parent-name">Outcomeなし</span>'}</div>${o?`<span class="parent-date" title="${esc(inputDate(o.start))} ～ ${esc(inputDate(o.end))}">${esc(displayDate(o.start))} ～ ${esc(displayDate(o.end))}</span>${o.complete?'<span class="parent-completion">完了</span>':''}`:''}</div>`}
function addRowHTML(o){return `<div class="task-add-row"><button class="task-add-action" data-add-parent="${o?.id||''}" aria-label="${esc(o?.name||'Outcomeなし')}に新しいタスクを追加"><span aria-hidden="true">＋</span> 新しいタスクを追加</button></div>`}
function listHTML(){return `<div class="view-tabs"><button class="view-tab ${listView==='list'?'active':''}" data-list="list">階層一覧</button><button class="view-tab ${listView==='cards'?'active':''}" data-list="cards">Outcomeカード</button></div>`+(listView==='cards'?`<div class="outcome-grid">${groups().map(g=>`<article class="preview-card">${parentHTML(g.outcome)}${expanded(g.outcome)?g.children.map(taskHTML).join('')+addRowHTML(g.outcome):''}</article>`).join('')}</div>`:`<section class="panel preview-list-panel"><div class="preview-table-head"><span class="hierarchy-column-heading">Outcome</span><span class="task-column-heading">Task</span><span>ステータス</span><span>カテゴリ</span><span>対応予定期間</span><span>締切日</span><span>次の対応予定</span></div>${groups().map(g=>parentHTML(g.outcome)+(expanded(g.outcome)?g.children.map(taskHTML).join('')+addRowHTML(g.outcome):'')).join('')}</section>`)}
function dates(){if(period==='month'){const d=new Date('2026-10-01T12:00Z');d.setUTCMonth(d.getUTCMonth()+shift);const start=d.toISOString().slice(0,10);d.setUTCMonth(d.getUTCMonth()+1);d.setUTCDate(0);return Array.from({length:d.getUTCDate()},(_,i)=>dayAdd(start,i))}const count=period==='week'?7:14;return Array.from({length:count},(_,i)=>dayAdd('2026-09-28',shift*count+i))}
function ganttHTML(){const days=dates(),segments=[];days.forEach((d,i)=>{const month=d.slice(0,7),last=segments.at(-1);if(last?.month===month)last.count++;else segments.push({month,start:i,count:1})});const labels=[],tracks=[];const cuts=segments.slice(1).map(s=>`<span class="gantt-month-border" style="left:${s.start/days.length*100}%"></span>`).join('');function track(item,parent=false){const indices=days.map((d,i)=>d>=item.start&&d<=item.end?i:-1).filter(i=>i>=0);return `<div class="gantt-track-preview ${parent?'parent':''}" ${parent?`data-outcome="${item.id}"`:`data-task="${item.id}"`}>${cuts}${indices.length?`<div class="gantt-bar-preview ${parent?'parent':''} ${item.status==='Done'?'done':''}" style="left:${indices[0]/days.length*100}%;width:${indices.length/days.length*100}%"></div>`:''}</div>`}for(const g of groups()){const o=g.outcome;labels.push(`<div class="gantt-label-preview parent">${foldHTML(o)}${o?`<button class="parent-name" data-outcome="${o.id}">${esc(o.name)}</button>`:'<span class="parent-name">Outcomeなし</span>'}</div>`);tracks.push(o?track(o,true):`<div class="gantt-track-preview parent">${cuts}</div>`);if(expanded(o)){for(const t of g.children){labels.push(`<div class="gantt-label-preview task">${checkHTML(t)}<div class="gantt-task-copy"><button class="task-name-preview ${t.status==='Done'?'done-name':''}" data-task="${t.id}">${esc(t.name)}</button>${countsHTML(t)}</div></div>`);tracks.push(track(t))}labels.push(`<div class="gantt-add-row">${addRowHTML(o)}</div>`);tracks.push(`<div class="gantt-add-track"></div>`)}}
return `<div class="toolbar"><label class="selection-info">表示期間 <select class="field" id="gantt-period"><option value="week" ${period==='week'?'selected':''}>1週間</option><option value="fortnight" ${period==='fortnight'?'selected':''}>2週間</option><option value="month" ${period==='month'?'selected':''}>1ヶ月</option></select></label><span class="spacer"></span><button class="icon-button" id="prev-period" aria-label="前の期間">‹</button><button class="secondary" id="today-period">サンプルの基準日</button><button class="icon-button" id="next-period" aria-label="次の期間">›</button><span class="selection-info">${days[0]} ～ ${days.at(-1)}</span></div><section class="panel gantt-container"><div class="gantt-grid-preview" style="--day-count:${days.length};--timeline-min:${days.length*(period==='month'?28:48)}px"><div class="gantt-name-header">Outcome / Task</div><div class="date-header-preview"><div class="month-header-preview">${segments.map(s=>`<div class="month-segment" style="grid-column:${s.start+1}/span ${s.count}">${s.month.slice(0,4)}年 ${Number(s.month.slice(5))}月</div>`).join('')}</div><div class="day-header-preview">${days.map(d=>`<div class="day-number ${[0,6].includes(new Date(d+'T12:00Z').getUTCDay())?'weekend':''} ${d==='2026-10-02'?'today':''}" title="${esc(displayDate(d,true))}">${Number(d.slice(8))}</div>`).join('')}</div></div><div>${labels.join('')}</div><div>${tracks.join('')}</div></div></section>`}
const sampleToday='2026-10-02';let calendarMode='month',calendarCursor=sampleToday,nextFrom='',nextTo='';
function activeTasks(){return tasks.filter(t=>t.status!=='Done'&&t.start&&t.end&&t.start<=sampleToday&&t.end>=sampleToday)}
function scheduledTasks(){return tasks.filter(t=>t.status!=='Done'&&t.next&&(!nextFrom||t.next.slice(0,10)>=nextFrom)&&(!nextTo||t.next.slice(0,10)<=nextTo)).sort((a,b)=>a.next.localeCompare(b.next))}
function dashboardRow(t,kind){return `<div class="task-row dashboard-task-row">${checkHTML(t)}<div class="row-main"><button class="row-title task-name-preview" title="${esc(t.name)}" data-task="${t.id}">${esc(t.name)}</button><div class="row-sub">${esc(outcomes.find(o=>o.id===t.outcome)?.name||'Outcomeなし')} · ${esc(t.category||'カテゴリなし')}${kind==='next'&&t.nextAction?' · '+esc(t.nextAction):''}</div>${countsHTML(t)}</div><span class="row-end">${kind==='next'?displayDate(t.next.slice(0,10))+'<br>'+esc(t.next.slice(11))+'–'+esc(t.nextEnd):displayDate(t.start)+' 〜 '+displayDate(t.end)}</span></div>`}
function dashboardHTML(){const scheduled=scheduledTasks(),active=activeTasks();return `<div class="cards">${[['残タスク',tasks.filter(t=>!['Done','Someday'].includes(t.status)).length,'Someday・Doneを除く'],['対応予定期間中',active.length,'今日の作業対象'],['完了Task',tasks.filter(t=>t.status==='Done').length,'ステータスがDone']].map(([label,n,foot])=>`<section class="metric"><div class="metric-label">${label}</div><div class="metric-number">${n}</div><div class="metric-foot">${foot}</div></section>`).join('')}</div><div class="grid-2"><section class="panel"><div class="panel-header"><div><h2 class="panel-title">次の対応予定</h2><p class="panel-caption">過去の予定も表示 · 古い順</p></div><span class="pill">${scheduled.length} 件</span></div><div class="panel-body"><div class="toolbar" style="margin-top:12px"><input class="field" type="date" aria-label="予定の絞り込み開始日" id="next-from" value="${nextFrom}"><span>〜</span><input class="field" type="date" aria-label="予定の絞り込み終了日" id="next-to" value="${nextTo}"><button class="ghost" id="clear-next">解除</button></div>${scheduled.map(t=>dashboardRow(t,'next')).join('')||'<div class="empty">次の対応予定はありません。</div>'}</div></section><section class="panel"><div class="panel-header"><div><h2 class="panel-title">対応予定期間中</h2><p class="panel-caption">今日が期間に含まれるTask</p></div><span class="pill">${active.length} 件</span></div><div class="panel-body">${active.map(t=>dashboardRow(t,'range')).join('')||'<div class="empty">期間中のTaskはありません。</div>'}</div></section></div>`}
function calendarDays(){let first=calendarCursor;if(calendarMode==='day')return [first];if(calendarMode==='month')first=first.slice(0,7)+'-01';first=dayAdd(first,-new Date(first+'T12:00Z').getUTCDay());return Array.from({length:calendarMode==='month'?42:7},(_,i)=>dayAdd(first,i))}
function calendarMove(dir){if(calendarMode==='month'){const d=new Date(calendarCursor.slice(0,7)+'-01T12:00Z');d.setUTCMonth(d.getUTCMonth()+dir);calendarCursor=d.toISOString().slice(0,10)}else calendarCursor=dayAdd(calendarCursor,dir*(calendarMode==='week'?7:1));render()}
function calendarEvent(t,type){return `<div class="calendar-check-event">${checkHTML(t)}<div class="calendar-task-copy"><button class="cal-event ${type==='due'?'due':'next'}" title="${esc(t.name)}" data-task="${t.id}">${type==='due'?'◆ 締切 ':esc(t.next.slice(11))+'–'+esc(t.nextEnd)+' '}${esc(t.name)}</button>${countsHTML(t)}</div></div>`}
function minute(time){const [h,m]=time.split(':').map(Number);return h*60+m}
function calendarLayout(items){const result=[];let group=[],ends=[],last=-1;function flush(){for(const item of group)item.columns=ends.length;result.push(...group);group=[];ends=[]}for(const task of [...items].sort((a,b)=>a.next.localeCompare(b.next))){const start=minute(task.next.slice(11)),end=minute(task.nextEnd);if(start>=last){flush();last=-1}let column=ends.findIndex(e=>e<=start);if(column<0)column=ends.length;ends[column]=end;last=Math.max(last,end);group.push({task,column,columns:1})}flush();return result}
function calendarHTML(){const days=calendarDays(),due=day=>visibleTasks().filter(t=>t.due===day),scheduled=day=>visibleTasks().filter(t=>t.next?.slice(0,10)===day);const toolbar=`<div class="toolbar"><div>${[['day','日'],['week','週'],['month','月']].map(([mode,label])=>`<button class="chip-button ${calendarMode===mode?'active':''}" data-calendar-mode="${mode}">${label}</button>`).join('')}</div><span class="spacer"></span><button class="icon-button" id="calendar-prev" aria-label="カレンダーの前の期間">‹</button><button class="secondary" id="calendar-today">今日</button><button class="icon-button" id="calendar-next" aria-label="カレンダーの次の期間">›</button><strong>${calendarMode==='week'?days[0]+' – '+days[6]:calendarCursor.slice(0,calendarMode==='day'?10:7)}</strong></div>`;if(calendarMode==='month')return toolbar+`<section class="panel calendar-preview"><div class="calendar-grid">${['日','月','火','水','木','金','土'].map(d=>`<div class="cal-weekday">${d}</div>`).join('')}${days.map(d=>`<div class="cal-day ${d.slice(0,7)!==calendarCursor.slice(0,7)?'other':''} ${d===sampleToday?'today':''}"><div class="cal-num">${Number(d.slice(8))}</div>${due(d).map(t=>calendarEvent(t,'due')).join('')}${scheduled(d).map(t=>calendarEvent(t,'next')).join('')}</div>`).join('')}</div></section>`;return toolbar+`<section class="panel schedule-scroll"><div class="schedule-grid" style="--days:${days.length};--minwidth:${68+days.length*160}px"><div class="schedule-corner">時刻</div>${days.map(d=>`<div class="schedule-day-head ${d===sampleToday?'today':''}"><strong>${displayDate(d)}</strong>${due(d).map(t=>calendarEvent(t,'due')).join('')||'<span class="schedule-no-due">締切なし</span>'}</div>`).join('')}<div class="schedule-hour-gutter">${Array.from({length:25},(_,h)=>`<span class="schedule-hour ${h===24?'last':''}" style="top:${h*48}px">${h}:00</span>`).join('')}</div>${days.map(d=>`<div class="schedule-day-track ${d===sampleToday?'today':''}">${calendarLayout(scheduled(d)).map(({task:t,column,columns})=>`<div class="schedule-event" style="top:${minute(t.next.slice(11))/60*48}px;height:${(minute(t.nextEnd)-minute(t.next.slice(11)))/60*48}px;left:calc(${column/columns*100}% + 2px);width:calc(${100/columns}% - 4px);right:auto">${checkHTML(t)}<div class="calendar-task-copy"><button class="schedule-event-open" data-task="${t.id}" title="${esc(t.name)}">${esc(t.next.slice(11))}–${esc(t.nextEnd)} ${esc(t.name)}</button>${countsHTML(t)}</div></div>`).join('')}</div>`).join('')}</div></section><p class="time-legend">◆ 締切を上部に表示。時間帯が重なる予定は横に並べます。0:00～24:00までスクロールできます。</p>`}

<script>

const sampleMemo='# メモ\n\n- 課題を整理する\n- 改善案へ引き継ぐ';
for(const t of tasks)t.memo=sampleMemo;
const sampleAudit=[
 {at:'2026-10-05T06:20:00Z',summary:'メモを変更、資料を2件追加'},
 {at:'2026-10-05T05:00:00Z',summary:'締切日：未設定 → 2026/10/9(金)'},
 {at:'2026-10-05T04:30:00Z',summary:'ステータス：Inbox → Doing'},
 {at:'2026-10-02T00:00:00Z',summary:'Taskを作成'}
];
for(const [index,t] of tasks.entries())if(index<4){t.createdAt='2026-10-02T00:00:00Z';t.updatedAt=index===0?sampleAudit[0].at:'2026-10-05T02:00:00Z';t.history=index===0?[...sampleAudit]:[{at:t.updatedAt,summary:'次の対応予定を変更'},{at:t.createdAt,summary:'Taskを作成'}]}
outcomes[0].createdAt='2026-09-28T00:00:00Z';outcomes[0].updatedAt='2026-10-05T03:00:00Z';outcomes[0].history=[{at:outcomes[0].updatedAt,summary:'対応予定期間を変更'},{at:outcomes[0].createdAt,summary:'Outcomeを作成'}];
outcomes[1].createdAt='2026-10-01T01:00:00Z';outcomes[1].updatedAt=outcomes[1].createdAt;outcomes[1].history=[{at:outcomes[1].createdAt,summary:'Outcomeを作成'}];
function auditDate(value){if(!value)return '不明';const d=new Date(value);return displayDate(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),true)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function auditMeta(){document.querySelector('.audit-meta')?.remove();const meta=document.createElement('dl');meta.className='audit-meta';meta.innerHTML=`<div><dt>作成日時</dt><dd>${draft.id?esc(auditDate(draft.createdAt)):'作成時に自動記録'}</dd></div><div><dt>最終更新日時</dt><dd>${draft.id?esc(auditDate(draft.updatedAt)):'保存時に自動記録'}</dd></div>`;$('.preview-drawer-head').append(meta)}
function historyHTML(){const rows=[...(draft.history||[])].sort((a,b)=>b.at.localeCompare(a.at));return `<div class="history-heading"><h3>更新履歴</h3><span class="pill">${rows.length} 件</span></div><p class="history-caption">新しい順 · 日時は端末の時刻で表示</p>${rows.length?`<ol class="history-list">${rows.map(row=>`<li class="history-entry"><time datetime="${esc(row.at)}">${esc(auditDate(row.at))}</time><p>${esc(row.summary)}</p></li>`).join('')}</ol>`:`<div class="history-empty">${draft.id?'履歴はまだありません。<br>次に内容を変更して保存した時点から記録します。':'作成すると、日時と作成記録が自動で追加されます。'}</div>`}`}
const baseDrawTaskTabs=drawTaskTabs,baseOpenTask=openTask,baseOpenOutcome=openOutcome,baseSave=$('#drawer-save').onclick;
let outcomeTab='basic';
function rememberOutcome(){if(outcomeTab==='basic'&&$('#detail-name')){draft.name=$('#detail-name').value;draft.start=readDate($('#detail-start').value);draft.end=readDate($('#detail-end').value);draft.memo=$('#detail-outcome-memo')?.value||'';draft.complete=$('#outcome-complete').checked}}
function drawOutcomeTabs(){const basic=$('#drawer-content');if(outcomeTab==='basic'){const remaining=tasks.some(t=>draft.id&&t.outcome===draft.id&&t.status!=='Done');basic.innerHTML=`${remaining?'<p class="preview-notice">Done以外のTaskがあるため、完了チェックは付けられません。</p>':''}<label class="form-label" for="detail-name">Outcome名</label><input class="form-input" id="detail-name" value="${esc(draft.name)}"><div class="divider"></div><h3 class="small-heading">対応期間</h3><div class="form-grid"><div><label class="form-label">開始日</label><input class="form-input" id="detail-start" value="${esc(inputDate(draft.start))}" placeholder="YYYY-MM-DD"></div><div><label class="form-label">終了日</label><input class="form-input" id="detail-end" value="${esc(inputDate(draft.end))}" placeholder="YYYY-MM-DD"></div></div><div class="divider"></div><label class="form-label" for="detail-outcome-memo">メモ</label><textarea id="detail-outcome-memo" class="form-textarea" placeholder="Markdownで記載">${esc(draft.memo||'')}</textarea><div class="divider"></div><h3 class="small-heading">紐づくTask</h3>${tasks.filter(t=>draft.id&&t.outcome===draft.id).map(t=>`<p class="selection-info">${esc(t.name)}　${t.status}</p>`).join('')||'<p class="selection-info">紐づくTaskなし</p>'}`}else basic.innerHTML=historyHTML();$('#drawer-tabs').innerHTML=[['basic','基本情報'],['history','履歴']].map(([id,label])=>`<button type="button" class="${outcomeTab===id?'active':''}" data-outcome-tab="${id}">${label}</button>`).join('');document.querySelectorAll('[data-outcome-tab]').forEach(b=>b.onclick=()=>{rememberOutcome();outcomeTab=b.dataset.outcomeTab;drawOutcomeTabs();basic.scrollTop=0})}
drawTaskTabs=()=>{if(detailTab==='history'){$('#drawer-content').innerHTML=historyHTML();$('#drawer-tabs').innerHTML=[['basic','基本情報'],['memo','メモ'],['materials','資料リンク '+(draft.materials?.length||0)],['chats','関連チャット '+(draft.chats?.length||0)],['history','履歴']].map(([id,label])=>`<button type="button" class="${detailTab===id?'active':''}" data-detail-tab="${id}">${label}</button>`).join('');document.querySelectorAll('[data-detail-tab]').forEach(b=>b.onclick=()=>{detailTab=b.dataset.detailTab;drawTaskTabs()})}else{baseDrawTaskTabs();$('#drawer-tabs').insertAdjacentHTML('beforeend','<button type="button" data-detail-tab="history">履歴</button>');$('#drawer-tabs [data-detail-tab="history"]').onclick=()=>{rememberTask();detailTab='history';drawTaskTabs();$('#drawer-content').scrollTop=0}}};

const historyFields={name:'名前',status:'ステータス',category:'カテゴリ',due:'締切日',start:'期間開始日',end:'期間終了日',next:'次の対応予定',nextEnd:'終了時刻',outcome:'Outcome',nextAction:'次の予定で行うこと',memo:'メモ',complete:'完了',materials:'資料',chats:'関連チャット',subtasks:'サブタスク'};
function historyValue(key,value){if(value===undefined||value==='')return '未設定';if(key==='complete')return value?'完了':'未完了';if(key==='outcome')return outcomes.find(o=>o.id===value)?.name||'Outcomeなし';if(/^\d{4}-\d{2}-\d{2}$/.test(String(value)))return displayDate(value,true);return String(value)}
function summaries(before,after){const result=[];for(const [key,label] of Object.entries(historyFields)){const a=before[key],b=after[key];if(JSON.stringify(a??(['materials','chats','subtasks'].includes(key)?[]:''))===JSON.stringify(b??(['materials','chats','subtasks'].includes(key)?[]:'')))continue;if(['materials','chats','subtasks'].includes(key)){const delta=(b?.length||0)-(a?.length||0);result.push(delta>0?`${label}を${delta}件追加`:delta<0?`${label}を${-delta}件削除`:`${label}を変更`)}else if(['memo','nextAction','name'].includes(key))result.push(label+'を変更');else result.push(label+'：'+historyValue(key,a)+' → '+historyValue(key,b))}return result}
function stamp(item,before,type){const changes=before?summaries(before,item):[type+'を作成'];if(!changes.length)return false;const at=new Date().toISOString();if(!before)item.createdAt=at;item.updatedAt=at;item.history=[...(before?.history||[]),{at,summary:changes.join('、')}];return true}
$('#drawer-save').onclick=()=>{const list=kind==='task'?tasks:outcomes;const before=draft.id?structuredClone(list.find(x=>x.id===draft.id)):null;const oldParents=structuredClone(outcomes);const creating=!draft.id;if(kind==='outcome'){rememberOutcome();outcomeTab='basic';drawOutcomeTabs()}else if(detailTab==='history'){detailTab='basic';drawTaskTabs()}baseSave();if(!$('.preview-drawer').hidden)return;const item=creating?list.at(-1):list.find(x=>x.id===before.id);stamp(item,before,kind==='task'?'Task':'Outcome');for(const old of oldParents){const current=outcomes.find(o=>o.id===old.id);if(current&&current!==item)stamp(current,old,'Outcome')}render()};
const baseComplete=completeTask,baseStatus=changeStatus;
function recordInline(action,id,value){const before=structuredClone(tasks.find(t=>t.id===id)),parents=structuredClone(outcomes);action(id,value);stamp(tasks.find(t=>t.id===id),before,'Task');for(const old of parents)stamp(outcomes.find(o=>o.id===old.id),old,'Outcome');render()}
completeTask=(id,value)=>recordInline(baseComplete,id,value);changeStatus=(id,value)=>recordInline(baseStatus,id,value);
