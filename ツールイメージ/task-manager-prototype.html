    const date = (offset=0) => { const d=new Date(today); d.setDate(d.getDate()+offset); return isoLocal(d); };

ategory" ${state.ganttSort==='category'?'selected':''}>カテゴリ順</option></select><span class="spacer"></span>${btn('‹','gantt-prev','icon-button')}${btn('今日','gantt-today')}${btn('›','gantt-next','icon-button')}<span class="selection-info">${fmt(start)} – ${fmt(end)}</span></div><section class="panel table-wrap"><div class="gantt-shell"><div class="gantt-label-head">Outcome / Task</div><div class="gantt-time-head">${days.map(d=>`<div class="day-head ${d===date()?'today':''}">${new Date(`${d}T12:00`).toLocaleDateString('ja-JP',{weekday:'short'})}<strong>${fmt(d)}</strong></div>`).join('')}</div><div>${labels}</div><div>${tracks}</div></div></section><p class="page-subtitle" style="margin-top:12px">⚠ はTaskの期間が紐づくOutcomeからはみ出していることを示します。行を選ぶとサイドバーで編集できます。</p>`}

        days=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return isoLocal(d)});
      }else days=[isoLocal(cursor)];
      const controls=`<div class="toolbar"><div style="display:flex;gap:4px">${[['day','日'],['week','週'],['month','月']].map(([v,n])=>`<button class="chip-button ${state.calendarMode===v?'active':''}" data-action="calendar-mode" data-mode="${v}">${n}</button>`).join('')}</div><span class="spacer"></span><label class="selection-info"><input type="checkbox" data-change="calendar-done" ${state.calendarShowDone?'checked':''}> Doneも表示</label>${btn('‹','calendar-prev','icon-button')}${btn('今日','calendar-today')}${btn('›','calendar-next','icon-button')}<strong style="min-width:100px;text-align:right;font-size:12px">${title}</strong></div>`;
      let body;
      if(state.calendarMode==='month'){
        body=`<section class="panel"><div class="calendar-grid">${['日','月','火','水','木','金','土'].map(d=>`<div class="cal-weekday">${d}</div>`).join('')}${days.map(d=>`<div class="cal-day ${d.slice(0,7)!==isoLocal(cursor).slice(0,7)?'other':''} ${d===date()?'today':''}"><div class="cal-num">${Number(d.slice(8))}</div>${calendarEvents(d).slice(0,3).map(e=>`<button class="cal-event ${e.type}" data-action="open-task" data-id="${esc(e.t.id)}" title="${esc(e.label+'・'+(e.type==='next'?fmtNext(e.t)+'・':'')+e.t.name)}">${e.type==='due'?'◆':'●'} ${esc(e.type==='next'?e.t.next.slice(11,16)+'–'+e.t.nextEnd+' '+e.t.name:e.t.name)}</button>`).join('')}${calendarEvents(d).length>3?`<span class="selection-info">＋${calendarEvents(d).length-3} 件</span>`:''}</div>`).join('')}</div></section>`;
      }else body=calendarTimeView(days);
      return `${pageHead('CALENDAR','カレンダー','締切日と次の対応予定を別の印で表示します。')}${controls}${body}`;
    }
    function timePickerMarkup(selected){const options=Array.from({length:24*60/state.timeStep},(_,i)=>{const minutes=i*state.timeStep,value=`${String(Math.floor(minutes/60)).padStart(2,'0')}:${String(minutes%60).padStart(2,'0')}`;return `<button type="button" class="time-option ${selected===value?'selected':''}" data-action="time-select" data-value="${value}">${value}</button>`}).join('');return `<div class="time-popover"><div class="time-popover-head"><span>時刻を選択</span><span><button type="button" class="time-step ${state.timeStep===15?'active':''}" data-action="time-step" data-step="15">15分</button> <button type="button" class="time-step ${state.timeStep===30?'active':''}" data-action="time-step" data-step="30">30分</button></span></div><div class="time-options">${options}</div><button type="button" class="time-clear" data-action="time-clear">時刻をクリア</button></div>`}
    function openTimePicker(field){app.querySelector('.time-popover')?.remove();const input=field.querySelector('input');field.insertAdjacentHTML('beforeend',timePickerMarkup(input.value));const selected=field.querySelector('.time-option.selected');if(selected)field.querySelector('.time-options').scrollTop=Math.max(0,selected.offsetTop-field.querySelector('.time-options').offsetTop-60)}
    function renderDrawer(){const isTask=state.drawer.type==='task';const model=isTask?state.tasks.find(x=>x.id===state.drawer.id):state.outcomes.find(x=>x.id===state.drawer.id);const fresh=!model;const v=model||{name:'',memo:'',category:'',status:'Inbox',due:'',start:'',end:'',next:'',nextEnd:'',outcomeId:'',priority:'Medium',complete:false};const children=isTask?[]:state.tasks.filter(t=>t.outcomeId===v.id);const canComplete=children.every(t=>t.status==='Done');return `<div class="drawer-backdrop" data-action="close-drawer"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${isTask?'Task':'Outcome'}の編集"><div class="drawer-head"><div><div class="eyebrow">${fresh?'CREATE':'DETAIL'}</div><h2>${isTask?'Task':'Outcome'}${fresh?'を作成':'を編集'}</h2></div>${btn('×','close-drawer','icon-button')}</div><form class="drawer-scroll" id="detail-form"><input type="hidden" name="type" value="${isTask?'task':'outcome'}"><input type="hidden" name="id" value="${esc(v.id||'')}"><div class="form-group"><label class="form-label" for="edit-name">名前 *</label><input id="edit-name" class="form-input" name="name" required value="${esc(v.name)}" placeholder="${isTask?'Task名':'Outcome名'}"></div>${isTask?`<div class="form-grid"><div class="form-group"><label class="form-label">ステータス</label><select class="form-select" name="status">${statuses.map(s=>`<option ${v.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">カテゴリ</label><select class="form-select" name="category"><option value="">未設定</option>${categories.map(c=>`<option ${v.category===c?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="form-group"><label class="form-label">Outcome</label><select class="form-select" name="outcomeId"><option value="">Outcomeなし</option>${state.outcomes.map(o=>`<option value="${esc(o.id)}" ${v.outcomeId===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select></div>`:`<div class="form-grid"><div class="form-group"><label class="form-label">優先度</label><select class="form-select" name="priority">${['High','Medium','Low'].map(p=>`<option ${v.priority===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">完了フラグ</label><select class="form-select" name="complete"><option value="false" ${!v.complete?'selected':''}>未完了</option><option value="true" ${v.complete?'selected':''} ${canComplete?'':'disabled'}>完了</option></select><p class="form-hint">${canComplete?'手動で完了にできます。':'Done以外のTaskがあるため完了にできません。'}</p></div></div>`}<div class="divider"></div><h3 class="small-heading">対応予定期間</h3><div class="form-grid"><div class="form-group"><label class="form-label">開始側</label><select class="form-select" name="startMode"><option value="none" ${!v.start?'selected':''}>未設定</option>${isTask?`<option value="before" ${v.start==='before'?'selected':''}>以前</option>`:''}<option value="date" ${v.start&&v.start!=='before'?'selected':''}>日付</option></select><input class="form-input" style="margin-top:7px" type="date" name="startDate" value="${v.start&&v.start!=='before'?esc(v.start):''}"></div><div class="form-group"><label class="form-label">終了側</label><select class="form-select" name="endMode"><option value="none" ${!v.end?'selected':''}>未設定</option>${isTask?`<option value="after" ${v.end==='after'?'selected':''}>以降</option>`:''}<option value="date" ${v.end&&v.end!=='after'?'selected':''}>日付</option></select><input class="form-input" style="margin-top:7px" type="date" name="endDate" value="${v.end&&v.end!=='after'?esc(v.end):''}"></div></div><p class="form-hint">${isTask?'期間を設定する場合は開始側・終了側の両方を指定します。「以前」「以降」の組み合わせも可能です。':'Outcomeの期間はTaskと独立して設定します。未設定のままでも作成できます。'}</p><div id="form-message"></div>${isTask?`<div class="divider"></div><div class="form-grid"><div class="form-group"><label class="form-label">締切日</label><input class="form-input" type="date" name="due" value="${esc(v.due)}"></div><div class="form-group"><label class="form-label">次の対応予定（日付）</label><input class="form-input" type="date" name="nextDate" value="${esc(v.next?.slice(0,10)||'')}"></div></div><div class="form-grid"><div class="form-group"><label class="form-label">開始時刻</label><div class="time-field"><input type="hidden" name="nextStart" value="${esc(v.next?.slice(11,16)||'')}"><button type="button" class="time-trigger ${v.next?'':'empty'}" data-action="time-picker" data-field="nextStart">${esc(v.next?.slice(11,16)||'時刻を選択')}</button></div></div><div class="form-group"><label class="form-label">終了時刻</label><div class="time-field"><input type="hidden" name="nextEnd" value="${esc(v.nextEnd||'')}"><button type="button" class="time-trigger ${v.nextEnd?'':'empty'}" data-action="time-picker" data-field="nextEnd">${esc(v.nextEnd||'時刻を選択')}</button></div></div></div>`:''}<div class="form-group" style="margin-top:18px"><label class="form-label">メモ</label><textarea class="form-textarea" name="memo" placeholder="自由に記載できます">${esc(v.memo)}</textarea></div>${!isTask&&model?`<div class="summary-box"><strong>紐づくTask ${children.length}件</strong><br>${children.map(t=>`${esc(t.name)} · ${esc(t.status)}`).join('<br>')||'紐づくTaskはありません。'}</div>`:''}</form><div class="drawer-foot">${model?`<button class="link-danger" data-action="delete-${isTask?'task':'outcome'}" data-id="${esc(model.id)}">削除</button>`:''}<span class="spacer"></span>${btn('キャンセル','close-drawer','secondary')}<button class="primary" form="detail-form" ${state.errorMode?'disabled':''}>${fresh?'作成':'保存'}</button></div></aside>`}
    function toast(msg){state.toast=msg;render();setTimeout(()=>{if(state.toast===msg){state.toast='';render()}},2600)}
    function render(){app.innerHTML=shell();const schedule=app.querySelector('.schedule-scroll');if(schedule){schedule.scrollTop=state.calendarScrollTop;schedule.addEventListener('scroll',()=>{state.calendarScrollTop=schedule.scrollTop})}if(state.drawer){const f=document.getElementById('detail-form');if(f)updateFormWarning(f)}}
    function updateFormWarning(f){const box=document.getElementById('form-message');if(!box||f.elements.type.value!=='task')return;const bounds=getBounds(f);const candidate={start:bounds.start,end:bounds.end,outcomeId:f.elements.outcomeId.value};box.innerHTML=overflow(candidate)?'<div class="form-warning">⚠ このTaskの対応予定期間は、紐づくOutcomeの期間からはみ出しています。保存は可能です。</div>':''}
    function getBounds(f){const startMode=f.elements.startMode.value,endMode=f.elements.endMode.value;return {start:startMode==='date'?f.elements.startDate.value:startMode==='before'?'before':'',end:endMode==='date'?f.elements.endDate.value:endMode==='after'?'after':''}}
    function saveDetail(f){if(state.errorMode)return;const d=Object.fromEntries(new FormData(f).entries());const bounds=getBounds(f);const message=document.getElementById('form-message');if((bounds.start&&!bounds.end)||(!bounds.start&&bounds.end)){message.innerHTML='<div class="form-error">対応予定期間を設定する場合、開始側と終了側の両方が必要です。</div>';return}if(d.startMode==='date'&&!bounds.start||d.endMode==='date'&&!bounds.end){message.innerHTML='<div class="form-error">日付を選択してください。</div>';return}if(bounds.start&&bounds.end&&bounds.start!=='before'&&bounds.end!=='after'&&bounds.start>bounds.end){message.innerHTML='<div class="form-error">終了日は開始日以降にしてください。</div>';return}if(d.type==='task'){if((d.nextDate||d.nextStart||d.nextEnd)&&(!d.nextDate||!d.nextStart||!d.nextEnd)){message.innerHTML='<div class="form-error">次の対応予定を設定する場合、日付・開始時刻・終了時刻をすべて指定してください。</div>';return}if(d.nextStart&&d.nextEnd&&d.nextStart>=d.nextEnd){message.innerHTML='<div class="form-error">終了時刻は同じ日の開始時刻より後にしてください。</div>';return}const existing=state.tasks.find(t=>t.id===d.id);const item={id:existing?.id||`t${Date.now()}`,name:d.name.trim(),memo:d.memo,category:d.category,status:d.status,due:d.due,start:bounds.start,end:bounds.end,next:d.nextDate?`${d.nextDate}T${d.nextStart}`:'',nextEnd:d.nextEnd,outcomeId:d.outcomeId};if(!item.name)return;if(existing)Object.assign(existing,item);else state.tasks.unshift(item);if(item.status!=='Done'&&item.outcomeId){const o=outcome(item.outcomeId);if(o)o.complete=false}state.drawer=null;toast(existing?'Taskを更新しました':'Taskを作成しました')}else{const existing=state.outcomes.find(o=>o.id===d.id);const item={id:existing?.id||`o${Date.now()}`,name:d.name.trim(),memo:d.memo,start:bounds.start,end:bounds.end,priority:d.priority,complete:d.complete==='true'};if(!item.name)return;if(item.complete&&state.tasks.some(t=>t.outcomeId===item.id&&t.status!=='Done')){message.innerHTML='<div class="form-error">Done以外のTaskがあるため完了にできません。</div>';return}if(existing)Object.assign(existing,item);else state.outcomes.push(item);state.drawer=null;toast(existing?'Outcomeを更新しました':'Outcomeを作成しました')}}
    app.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='time-picker'){const field=el.closest('.time-field');if(field.querySelector('.time-popover'))field.querySelector('.time-popover').remove();else openTimePicker(field);return}if(a==='time-step'){state.timeStep=Number(el.dataset.step);const field=el.closest('.time-field');openTimePicker(field);return}if(a==='time-select'||a==='time-clear'){const field=el.closest('.time-field'),input=field.querySelector('input'),value=a==='time-select'?el.dataset.value:'';input.value=value;const trigger=field.querySelector('.time-trigger');trigger.textContent=value||'時刻を選択';trigger.classList.toggle('empty',!value);field.querySelector('.time-popover')?.remove();return}if(a==='nav'){state.view=el.dataset.view;state.drawer=null;render();return}if(a==='go-tasks'){state.view='tasks';state.catalogTab='list';render();return}if(a==='catalog-tab'){state.catalogTab=el.dataset.tab;render();return}if(a==='noop')return;if(a==='new-task'||a==='new-outcome'){if(state.errorMode)return;state.drawer={type:a==='new-task'?'task':'outcome',id:null};render();document.getElementById('edit-name')?.focus();return}if(a==='open-task'||a==='open-outcome'){state.drawer={type:a==='open-task'?'task':'outcome',id:el.dataset.id};render();return}if(a==='close-drawer'){state.drawer=null;render();return}if(a==='clear-next-filter'){state.nextFrom='';state.nextTo='';render();return}if(a.startsWith('gantt-')){state.ganttOffset=a==='gantt-today'?-3:state.ganttOffset+(a==='gantt-prev'?-7:7);render();return}if(a==='calendar-mode'){state.calendarMode=el.dataset.mode;render();return}if(a.startsWith('calendar-')){const c=new Date(state.calendarCursor);if(a==='calendar-today')state.calendarCursor=new Date(today);else if(state.calendarMode==='month')c.setMonth(c.getMonth()+(a==='calendar-prev'?-1:1));else c.setDate(c.getDate()+(a==='calendar-prev'?-1:1)*(state.calendarMode==='week'?7:1));if(a!=='calendar-today')state.calendarCursor=c;render();return}if(a==='delete-task'){if(state.errorMode)return;if(confirm('このTaskを削除しますか？')){state.tasks=state.tasks.filter(t=>t.id!==el.dataset.id);state.drawer=null;toast('Taskを削除しました')}return}if(a==='delete-outcome'){if(state.errorMode)return;if(confirm('このOutcomeを削除しますか？ 紐づくTaskは「Outcomeなし」に移ります。')){state.tasks.forEach(t=>{if(t.outcomeId===el.dataset.id)t.outcomeId=''});state.outcomes=state.outcomes.filter(o=>o.id!==el.dataset.id);state.drawer=null;toast('Outcomeを削除し、Taskの紐づけを外しました')}return}});
    document.addEventListener('click',e=>{if(!e.target.closest('.time-field'))app.querySelector('.time-popover')?.remove()});
    app.addEventListener('submit',e=>{if(e.target.id==='quick-add'){e.preventDefault();if(state.errorMode)return;const name=e.target.elements.name.value.trim();if(!name)return;state.tasks.unshift({id:`t${Date.now()}`,name,memo:'',category:'',status:'Inbox',due:'',start:'',end:'',next:'',nextEnd:'',outcomeId:''});toast('InboxにTaskを追加しました')}if(e.target.id==='detail-form'){e.preventDefault();saveDetail(e.target)}});
    app.addEventListener('change',e=>{const el=e.target,k=el.dataset.change;if(k){if(k==='task-status')state.taskStatus=el.value;if(k==='task-category')state.taskCategory=el.value;if(k==='gantt-status')state.ganttStatus=el.value;if(k==='gantt-category')state.ganttCategory=el.value;if(k==='gantt-sort')state.ganttSort=el.value;if(k==='calendar-done')state.calendarShowDone=el.checked;if(k==='next-from')state.nextFrom=el.value;if(k==='next-to')state.nextTo=el.value;render();return}if(el.closest('#detail-form'))updateFormWarning(el.form)});
    app.addEventListener('input',e=>{if(e.target.dataset.input==='task-search'){state.taskSearch=e.target.value;const pos=e.target.selectionStart;render();const field=app.querySelector('[data-input="task-search"]');field.focus();field.setSelectionRange(pos,pos)}else if(e.target.closest('#detail-form'))updateFormWarning(e.target.form)});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.drawer){state.drawer=null;render()}});
    render();
  })();
  </script>
</body>
</html>
